<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>افعال بی‌قاعده — یادگیری و تمرین</title>
<style>
  :root{
    --bg1:#4f46e5; --bg2:#7c3aed; --bg3:#0ea5e9;
    --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --soft:#f1f5f9;
    --ok:#16a34a; --okbg:#dcfce7;
    --bad:#dc2626; --badbg:#fee2e2;
    --accent:#4f46e5; --accent2:#7c3aed;
    --radius:18px;
    --shadow:0 10px 30px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Vazirmatn","Vazir",Tahoma,"Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:linear-gradient(165deg,var(--bg1),var(--bg2));
    display:flex;justify-content:center;
    padding:18px 14px calc(env(safe-area-inset-bottom) + 18px);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    -webkit-text-size-adjust:100%;
  }
  .app{width:100%;max-width:680px}

  /* Header */
  header{color:#fff;text-align:center;margin:6px 2px 14px}
  header h1{margin:0;font-size:clamp(20px,5.5vw,28px);font-weight:800;letter-spacing:-.3px}
  header p{margin:4px 0 0;opacity:.85;font-size:13px}

  .statbar{display:flex;gap:8px;margin:14px 0;}
  .stat{flex:1;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:9px 6px;color:#fff;text-align:center}
  .stat b{display:block;font-size:clamp(16px,4.6vw,22px);font-weight:800;line-height:1.1}
  .stat span{font-size:11px;opacity:.85}

  /* Tabs */
  nav.tabs{display:flex;gap:5px;background:rgba(255,255,255,.14);padding:5px;border-radius:16px;
    overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;white-space:nowrap;border:0;cursor:pointer;color:#fff;scroll-snap-align:center;
    background:transparent;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:700;
    font-family:inherit;transition:.2s;opacity:.78}
  .tab.active{background:#fff;color:var(--accent);opacity:1;box-shadow:0 4px 12px rgba(15,23,42,.18)}
  @media(max-width:380px){.tab{padding:10px 11px;font-size:13px}}

  /* Card */
  main{margin-top:14px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px 18px;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .word{direction:ltr;font-weight:800;letter-spacing:.5px;line-height:1.15}
  .muted{color:var(--muted)}
  .center{text-align:center}

  /* Learn / flashcard */
  .flash{text-align:center}
  .flash .lead{color:var(--muted);font-size:13px;margin-bottom:8px}
  .flash .base{font-size:clamp(30px,9vw,46px);color:var(--accent);}
  .forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .form{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center}
  .form small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
  .form .v{direction:ltr;font-size:clamp(16px,4.6vw,21px);font-weight:800}
  .hidden-form{filter:blur(7px);cursor:pointer;user-select:none}
  .progress{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin:16px 0 4px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}

  .row{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;
    padding:13px;border-radius:13px;transition:.15s;background:var(--soft);color:var(--ink)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.35)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
  .icon-btn{flex:0 0 auto;width:50px;background:var(--soft);font-size:18px}

  /* Quiz */
  .prompt{text-align:center;margin-bottom:6px}
  .prompt .ask{color:var(--muted);font-size:14px}
  .prompt .qword{font-size:clamp(28px,8vw,42px);color:var(--accent);margin:8px 0}
  .prompt .tag{display:inline-block;background:var(--soft);color:var(--muted);
    padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700}
  .target{margin-top:10px;font-size:15px;font-weight:700}
  .target b{color:var(--accent2)}
  .fa-mean{color:var(--muted);font-size:15px;font-weight:700;margin-top:6px}
  .flash .fa-mean{font-size:17px;color:var(--ink);margin-top:8px}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  @media(max-width:420px){.options{grid-template-columns:1fr}}
  .opt{direction:ltr;border:1.5px solid var(--line);background:#fff;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:17px;padding:14px 12px;border-radius:14px;transition:.15s;color:var(--ink);
    text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center;word-break:break-word}
  .opt:active{transform:scale(.97)}
  .opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}

  .typewrap{margin-top:18px}
  input.type{width:100%;direction:ltr;text-align:center;font-family:inherit;font-weight:800;
    font-size:22px;padding:15px;border:2px solid var(--line);border-radius:14px;outline:none;transition:.15s}
  input.type:focus{border-color:var(--accent)}
  input.type.correct{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  input.type.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}

  .feedback{margin-top:14px;border-radius:14px;padding:13px 14px;font-weight:700;display:none}
  .feedback.show{display:block;animation:rise .25s}
  .feedback.ok{background:var(--okbg);color:var(--ok)}
  .feedback.bad{background:var(--badbg);color:var(--bad)}
  .feedback .full{direction:ltr;display:block;margin-top:6px;font-weight:800;color:var(--ink);font-size:15px}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  .mini{display:flex;justify-content:center;gap:16px;margin-top:16px;color:var(--muted);font-size:13px}
  .mini b{color:var(--ink)}

  /* Mistakes */
  .mlist{margin-top:6px;display:flex;flex-direction:column;gap:8px}
  .mitem{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:13px;padding:11px 13px}
  .mitem .w{direction:ltr;font-weight:800;font-size:17px;flex:0 0 auto}
  .mitem .d{direction:ltr;color:var(--muted);font-size:13px;flex:1;text-align:left}
  .mitem .c{background:var(--badbg);color:var(--bad);font-weight:800;border-radius:99px;
    min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding:0 7px}
  .empty{text-align:center;color:var(--muted);padding:24px 8px}
  .empty .big{font-size:40px;margin-bottom:8px}

  .note{margin-top:12px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--muted);
    border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;border:0;font-family:inherit}
  footer{color:rgba(255,255,255,.7);text-align:center;font-size:11.5px;margin:16px 0 4px}
</style>
</head>
<body>

/* ---------- ذخیره‌سازی ---------- */
const KEY = "irregular_verbs_v1";
let store = loadStore();
function loadStore(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {mistakes:{}, life:{correct:0, wrong:0}};
}
let saveTimer=null;
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
let askedPersist=false;
async function askPersist(){
  if(askedPersist) return; askedPersist=true;
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = await navigator.storage.persisted();
      if(!already) await navigator.storage.persist();
    }
  }catch(e){}
}

/* ---------- ابزارها ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const rand = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function fa(n){return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);}
function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ");}
// امتیاز شباهت املایی: حروف مشترک + هم‌شروع/هم‌پایان بودن
function similar(a,b){
  a=norm(a); b=norm(b); let s=0;
  const sa=new Set(a), sb=new Set(b);
  sa.forEach(c=>{ if(sb.has(c)) s++; });
  if(a[0]===b[0]) s+=2;
  if(a[a.length-1]===b[b.length-1]) s++;
  s-=Math.abs(a.length-b.length)*0.5;
  return s;
}
function accepted(verb,type){
  const v = verb[type];
  const parts = v.split("/").map(norm);
  return new Set([norm(v),...parts]);
}

   حالا بهترین صدای انگلیسیِ دستگاه انتخاب می‌شود و کاربر هم می‌تواند تغییرش دهد. */
const VOICE_KEY = "tts_voice_v1";
let voicesCache = [];
let chosenVoice = null;
let preferredVoiceName = (()=>{ try{return localStorage.getItem(VOICE_KEY)||"";}catch(e){return "";} })();

function englishVoices(){ return voicesCache.filter(v=>/^en/i.test(v.lang||"")); }

// صداهای تفننی/بی‌کیفیتِ سیستم که برای آموزش بی‌فایده‌اند
const BAD_VOICE = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|junior|kathy|organ|princess|ralph|trinoids|whisper|wobble|zarvox|superstar|grandma|grandpa|rocko|sandy|shelley|reed|flo|eddy|fred|hysterical|novelty)\b/i;

// فقط صداهای مفید برای آموزش: آمریکایی/بریتانیایی، باکیفیت، بدون تکرار — حداکثر چند تا
function usefulVoices(){
  let list = voicesCache.filter(v=>{
    const l=v.lang||"", n=v.name||"";
    if(!/^en[-_](us|gb)/i.test(l)) return false;     // فقط US و GB
    if(/compact|eloquence/i.test(n)) return false;   // صداهای فشردهٔ بی‌کیفیت
    if(BAD_VOICE.test(n)) return false;              // صداهای تفننی
    return true;
  });
  if(!list.length) list = englishVoices();           // اگر چیزی نماند، عقب‌نشینی
  list = list.slice().sort((a,b)=>rankVoice(b)-rankVoice(a));
  const seen=new Set();
  return list.filter(v=>{ if(seen.has(v.name))return false; seen.add(v.name); return true; }).slice(0,5);
}

// امتیازدهی به صداها: طبیعی/باکیفیت بالا، compact پایین
function rankVoice(v){
  const n=(v.name||"").toLowerCase(), l=(v.lang||"");
  let s=0;
  if(/^en/i.test(l)) s+=40;
  if(/^en[-_]us/i.test(l)) s+=12; else if(/^en[-_]gb/i.test(l)) s+=8;
  if(n.includes("natural")) s+=30;
  if(n.includes("neural")) s+=28;
  if(n.includes("premium")||n.includes("enhanced")) s+=22;
  if(n.includes("google")) s+=20;
  if(n.includes("microsoft")) s+=10;
  if(/\b(samantha|alex|daniel|karen|moira|serena|aaron|ava|allison|tom|evan|zoe)\b/.test(n)) s+=14;
  if(n.includes("compact")) s-=25;
  if(n.includes("eloquence")) s-=25;
  if(v.localService===false) s+=6; // صداهای آنلاین معمولاً طبیعی‌ترند
  return s;
}

function pickVoice(){
  try{ voicesCache = speechSynthesis.getVoices() || []; }catch(e){ voicesCache=[]; }
  if(!voicesCache.length) return null;
  if(preferredVoiceName){
    const m = voicesCache.find(v=>v.name===preferredVoiceName);
    if(m) return m;
  }
  const good = usefulVoices();
  return good[0] || null;
}
function refreshVoices(){ chosenVoice = pickVoice(); }

if(window.speechSynthesis){
  refreshVoices();
  // بعضی مرورگرها لیست صداها را با تأخیر می‌دهند
  speechSynthesis.onvoiceschanged = ()=>{ refreshVoices(); if(activeTab==="learn") renderLearn(); };
}

function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    if(!chosenVoice) refreshVoices();
    // هر صورتِ فعل را جدا و با مکثِ طبیعی بگو تا واضح‌تر باشد
    const parts = String(text).split(",").map(s=>s.trim()).filter(Boolean);
    (parts.length?parts:[String(text)]).forEach(p=>{
      const u = new SpeechSynthesisUtterance(p);
      if(chosenVoice){ u.voice=chosenVoice; u.lang=chosenVoice.lang; }
      else u.lang="en-US";
      u.rate=.9; u.pitch=1;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

// منوی انتخاب صدا (فقط وقتی چند صدای انگلیسی موجود باشد)
function voiceSelectHTML(){
  const list = usefulVoices();
  if(list.length<2) return "";
  const cur = chosenVoice ? chosenVoice.name : "";
  const label = v=>{
    const flag = /^en[-_]gb/i.test(v.lang||"") ? "🇬🇧" : "🇺🇸";
    const name = v.name.replace(/\s*\((enhanced|premium|natural)\)/i,"").trim();
    return `${flag} ${name}`;
  };
  return `<select id="voiceSel" class="pill" style="direction:ltr;max-width:220px;font-size:12px;padding:6px 10px">
    ${list.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}"${v.name===cur?' selected':''}>${label(v)}</option>`).join("")}
  </select>`;
}

/* ---------- وضعیت ---------- */
let activeTab = "learn";
let learnIndex = 0;
let session = {correct:0, wrong:0, streak:0};
let quizMode = "choice";       // choice | type | mixed
let quizPool = "all";          // all | mistakes
let current = null;            // سوال جاری
let answered = false;

function mistakeVerbs(){ return VERBS.filter(v=>store.mistakes[v.infinitive]&&store.mistakes[v.infinitive].count>0); }
function poolVerbs(){ return quizPool==="mistakes" ? mistakeVerbs() : VERBS; }

// انتخاب کیسه‌ای (shuffle bag): هر فعل یک‌بار در هر دور می‌آید؛
// تکرار فقط بعد از تمام‌شدن دور رخ می‌دهد → نه تمرکز روی اولی‌ها، نه تکرار پشت‌سرهم.
let deck=[], deckKey="", lastVerb=null;
function nextVerb(){
  const pool=poolVerbs();
  if(!pool.length) return null;
  const key=quizPool+":"+pool.map(v=>v.infinitive).join(",");
  if(deckKey!==key){ deckKey=key; deck=[]; }
  if(deck.length===0){
    deck=shuffle(pool.slice());
    // جلوگیری از تکرارِ بلافاصله سرِ دورِ جدید
    if(deck.length>1 && deck[0].infinitive===lastVerb){ [deck[0],deck[1]]=[deck[1],deck[0]]; }
  }
  const v=deck.shift();
  lastVerb=v.infinitive;
  return v;
}

function recordMistake(verb,type){
  const k=verb.infinitive;
  const m = store.mistakes[k] || {count:0, forms:{}};
  m.count++; m.forms[type]=(m.forms[type]||0)+1;
  store.mistakes[k]=m;
  store.life.wrong++;
  saveStore();
}
function recordSuccess(verb,type){
  const k=verb.infinitive;
  if(store.mistakes[k]){
    const m=store.mistakes[k];
    m.count=Math.max(0,m.count-1);
    if(m.forms[type]) m.forms[type]=Math.max(0,m.forms[type]-1);
    if(m.count<=0) delete store.mistakes[k];
  }
  store.life.correct++;
  saveStore();
}

/* ---------- نوار آمار بالا ---------- */
function refreshStats(){
  const tot = store.life.correct + store.life.wrong;
  const acc = tot ? Math.round(store.life.correct/tot*100) : 0;
  $("#sAcc").textContent = fa(acc)+"٪";
  $("#sStreak").textContent = fa(session.streak);
  $("#sMis").textContent = fa(mistakeVerbs().length);
}

/* ---------- روتر ---------- */
function setTab(tab){
  activeTab=tab;
  document.querySelectorAll(".tab").forEach(b=>{
    const on=b.dataset.tab===tab; b.classList.toggle("active",on);
    if(on && b.scrollIntoView) b.scrollIntoView({inline:"center",block:"nearest"});
  });
  if(tab==="learn") renderLearn();
  else if(tab==="mistakes") renderMistakes();
  else { quizMode=tab; renderQuiz(); }
  refreshStats();
}

/* ---------- یادگیری (فلش‌کارت) ---------- */
let revealed=false;
function renderLearn(){
  const v = VERBS[learnIndex];
  const pct = ((learnIndex+1)/VERBS.length*100);
  view.innerHTML = `
  <div class="card flash">
    <div class="lead">کارت ${fa(learnIndex+1)} از ${fa(VERBS.length)}</div>
    <div class="word base" id="baseW">${v.infinitive}</div>
    <div class="fa-mean">${v.fa}</div>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center">
      <button class="pill" id="say">🔊 تلفظ</button>
      ${voiceSelectHTML()}
    </div>
    <div class="forms">
      <div class="form"><small>${LABEL.past_simple} · ${SHORT.past_simple}</small>
        <div class="v ${revealed?'':'hidden-form'}" data-reveal>${v.past_simple}</div></div>
      <div class="form"><small>${LABEL.past_participle} · ${SHORT.past_participle}</small>
        <div class="v ${revealed?'':'hidden-form'}" data-reveal>${v.past_participle}</div></div>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="row">
      <button class="btn" id="prev">قبلی ›</button>
      <button class="btn ghost" id="reveal">${revealed?'مخفی کن':'نمایش'}</button>
      <button class="btn primary" id="next">‹ بعدی</button>
    </div>
    <div class="note">روی قسمت تار بزن تا جواب را ببینی</div>
  </div>`;

  $("#say").onclick=()=>speak(`${v.infinitive}, ${v.past_simple.replace('/',' or ')}, ${v.past_participle}`);
  const vsel=$("#voiceSel");
  if(vsel) vsel.onchange=()=>{
    preferredVoiceName=vsel.value;
    try{ localStorage.setItem(VOICE_KEY, preferredVoiceName); }catch(e){}
    refreshVoices();
    speak(v.infinitive); // پیش‌نمایش صدای انتخاب‌شده
  };
  $("#reveal").onclick=()=>{revealed=!revealed;renderLearn();};
  view.querySelectorAll("[data-reveal]").forEach(el=>el.onclick=()=>{revealed=true;renderLearn();});
  $("#prev").onclick=()=>{learnIndex=(learnIndex-1+VERBS.length)%VERBS.length;revealed=false;renderLearn();};
  $("#next").onclick=()=>{learnIndex=(learnIndex+1)%VERBS.length;revealed=false;renderLearn();};
}

/* ---------- ساخت سوال ---------- */
function makeQuestion(){
  const verb = nextVerb();
  if(!verb){ current=null; return; }
  const answerType = rand(TYPES);
  let promptType; do{ promptType=rand(TYPES); }while(promptType===answerType);
  let mode = quizMode==="mixed" ? rand(["choice","type"]) : quizMode;
  let options=[];
  if(mode==="choice"){
    const correct=verb[answerType];
    const set=new Set([correct]);
    // فاصله‌نزدیک: اول صورت‌های دیگرِ همین فعل، بعد اشتباهات املایی رایج همین فعل
    const close=[];
    for(const t of TYPES){ if(t!==answerType) close.push(verb[t]); }
    if(verb.common_mistakes) close.push(...verb.common_mistakes);
    for(const d of shuffle(close)){ if(set.size>=4)break; if(d && d!==correct) set.add(d); }
    // اگر کم آمد، نزدیک‌ترین‌ها از نظر املا را از بقیهٔ افعال بردار (نه رندومِ بی‌ربط)
    if(set.size<4){
      const others=VERBS.filter(o=>o!==verb).map(o=>o[answerType])
        .filter(w=>w&&!set.has(w))
        .sort((a,b)=>similar(b,correct)-similar(a,correct));
      for(const w of others){ if(set.size>=4)break; set.add(w); }
    }
    options=shuffle([...set]);
  }
  current={verb,promptType,answerType,mode,options};
  answered=false;
}

function renderQuiz(){
  if(quizPool==="mistakes" && !mistakeVerbs().length){
    quizPool="all";
  }
  if(!current) makeQuestion();
  if(!current){ // pool خالی
    view.innerHTML=`<div class="card empty"><div class="big">🎉</div>چیزی برای تمرین نیست!</div>`;
    return;
  }
  const q=current, v=q.verb;
  const poolBadge = quizPool==="mistakes"
    ? `<button class="pill" id="poolBtn">🎯 فقط اشتباهات (${fa(mistakeVerbs().length)}) — تغییر</button>`
    : `<button class="pill" id="poolBtn">📚 همهٔ افعال — تمرین اشتباهات؟</button>`;

  let answerArea;
  if(q.mode==="choice"){
    answerArea=`<div class="options" id="opts">${q.options.map(o=>
      `<button class="opt" data-val="${o}">${o}</button>`).join("")}</div>`;
  }else{
    answerArea=`<div class="typewrap">
      <input class="type" id="ans" placeholder="جواب را تایپ کن…" autocomplete="off"
        autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
      <div class="row"><button class="btn primary" id="check">بررسی</button></div>
    </div>`;
  }

  view.innerHTML=`
  <div class="card">
    <div style="text-align:center;margin-bottom:10px">${poolBadge}</div>
    <div class="prompt">
      <div class="ask">${q.mode==="choice"?"کدام درست است؟":"این فعل را صرف کن"}</div>
      <div class="word qword">${v[q.promptType]}</div>
      <span class="tag">${LABEL[q.promptType]}</span>
      <div class="fa-mean">${v.fa}</div>
      <div class="target">→ ${LABEL[q.answerType]} <b>(${SHORT[q.answerType]})</b> ؟</div>
    </div>
    ${answerArea}
    <div class="feedback" id="fb"></div>
    <div class="mini">
      <span>درست: <b id="mc">${fa(session.correct)}</b></span>
      <span>غلط: <b id="mw">${fa(session.wrong)}</b></span>
      <span>زنجیره: <b id="ms">${fa(session.streak)}</b></span>
    </div>
  </div>`;

  $("#poolBtn").onclick=()=>{
    if(quizPool==="mistakes"){ quizPool="all"; }
    else { if(!mistakeVerbs().length){alert("هنوز اشتباهی ذخیره نشده 🙂");return;} quizPool="mistakes"; }
    current=null; makeQuestion(); renderQuiz(); refreshStats();
  };

  if(q.mode==="choice"){
    view.querySelectorAll(".opt").forEach(b=> b.onclick=()=>chooseAnswer(b.dataset.val,b));
  }else{
    const inp=$("#ans"); inp.focus();
    const go=()=>submitTyped(inp.value);
    $("#check").onclick=go;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  }
}

function finishAnswer(correct, chosen){
  askPersist();
  const q=current, v=q.verb;
  answered=true;
  if(correct){ session.correct++; session.streak++; recordSuccess(v,q.answerType); }
  else { session.wrong++; session.streak=0; recordMistake(v,q.answerType); }

  const fb=$("#fb");
  fb.className="feedback show "+(correct?"ok":"bad");
  fb.innerHTML = (correct? "✅ آفرین! درست بود." : `❌ نه، درستش این بود: <b>${v[q.answerType]}</b>`)
    + `<span class="full">${v.infinitive} → ${v.past_simple} → ${v.past_participle}</span>`
    + `<div style="margin-top:4px;color:var(--muted);font-size:14px">${v.fa}</div>`
    + `<div class="row"><button class="btn primary" id="nextQ">سوال بعدی ›</button>
         <button class="btn icon-btn" id="sayQ">🔊</button></div>`;
  $("#nextQ").onclick=()=>{ current=null; makeQuestion(); renderQuiz(); refreshStats(); };
  $("#sayQ").onclick=()=>speak(`${v.infinitive}, ${v.past_simple.replace('/',' or ')}, ${v.past_participle}`);
  if(!correct) fb.classList.add("shake");

  $("#mc").textContent=fa(session.correct);
  $("#mw").textContent=fa(session.wrong);
  $("#ms").textContent=fa(session.streak);
  refreshStats();
}

function chooseAnswer(val,btn){
  if(answered) return;
  const q=current;
  const correct = val===q.verb[q.answerType];
  view.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.val===q.verb[q.answerType]) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
  });
  finishAnswer(correct,val);
}

function submitTyped(value){
  if(answered) return;
  if(!value.trim()){ return; }
  const q=current;
  const ok = accepted(q.verb,q.answerType).has(norm(value));
  const inp=$("#ans");
  inp.disabled=true;
  inp.classList.add(ok?"correct":"wrong");
  $("#check").style.display="none";
  finishAnswer(ok,value);
}

/* ---------- اشتباهات ---------- */
function renderMistakes(){
  const list = mistakeVerbs()
    .sort((a,b)=>store.mistakes[b.infinitive].count-store.mistakes[a.infinitive].count);
  let body;
  if(!list.length){
    body=`<div class="empty"><div class="big">✨</div>هنوز اشتباهی ذخیره نشده.<br>برو تست بده تا اینجا پر بشه!</div>`;
  }else{
    body=`<div class="mlist">`+list.map(v=>{
      const m=store.mistakes[v.infinitive];
      const forms=Object.keys(m.forms).filter(f=>m.forms[f]>0).map(f=>SHORT[f]).join(" · ");
      return `<div class="mitem">
        <span class="w">${v.infinitive}</span>
        <span class="d">${v.past_simple} · ${v.past_participle}${forms?` &nbsp; [${forms}]`:''}<br><span dir="rtl" style="color:var(--muted)">${v.fa}</span></span>
        <span class="c">${fa(m.count)}</span></div>`;
    }).join("")+`</div>`;
  }
  view.innerHTML=`
  <div class="card">
    <div class="prompt"><div class="ask">افعالی که اشتباه زدی (ذخیره‌شده روی مرورگر)</div></div>
    ${body}
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="practice" ${list.length?'':'disabled style="opacity:.5"'}>🎯 تمرین فقط اشتباهات</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" id="clear" ${list.length?'':'disabled style="opacity:.5"'}>پاک کردن همه</button>
    </div>
    <div class="note">با هر جواب درست به این افعال، شمارنده کم می‌شود و وقتی به صفر برسد از لیست حذف می‌شوند.</div>
  </div>`;

  if(list.length){
    $("#practice").onclick=()=>{ quizPool="mistakes"; quizMode="mixed"; current=null; makeQuestion(); setTab("mixed"); };
    $("#clear").onclick=()=>{ if(confirm("همهٔ اشتباهات پاک شوند؟")){ store.mistakes={}; saveStore(); renderMistakes(); refreshStats(); } };
  }
}

/* ---------- راه‌اندازی ---------- */
document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click",()=>{
    const t=b.dataset.tab;
    if(t!=="mistakes" && t!=="learn"){ quizPool="all"; current=null; }
    setTab(t);
  });
});
refreshStats();
renderLearn();
</script>
